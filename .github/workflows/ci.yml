name: CI

on:
  push:
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install
        run: python -m pip install -e ".[dev,provenance]"

      - name: Lint (ruff)
        run: ruff check src tests eval benchmarks scripts

      - name: Type check (mypy)
        run: mypy src

      - name: Unit tests
        run: pytest --cov=pramaan --cov-report=term-missing

      - name: CLI smoke
        run: |
          python -m pramaan.cli --help
          python -m pramaan.cli setup

  # `smoke`-tier end-to-end pipeline run: ~200 claims, built from the real
  # public sources. See docs/EVALUATION_PROTOCOL.md for the three-tier
  # (smoke/dev/full) discipline and why smoke output is never a reported
  # result. Budget: < 5 minutes warm.
  #
  # data/raw/ is cached because the source fetch dominates runtime and is
  # the only part of this job that can fail for reasons unrelated to the
  # code. The cache key is deliberately coarse — the fetchers are
  # append-only and resume from what is already cached, so a stale hit is
  # still correct, just less complete.
  smoke-pipeline:
    runs-on: ubuntu-latest
    needs: lint-type-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install
        run: python -m pip install -e ".[dev,provenance]"

      - name: Cache source image pools
        uses: actions/cache@v6
        with:
          path: data/raw
          key: pramaan-sources-v1-${{ hashFiles('benchmarks/sources.py') }}
          restore-keys: pramaan-sources-v1-

      - name: pramaan all --scale smoke
        run: python -m pramaan.cli all --scale smoke

      - name: Corpus integrity
        run: |
          python - <<'PY'
          import hashlib
          from benchmarks.loaders import load_corpus

          corpus = load_corpus("smoke")
          print(f"claims: {len(corpus)}")
          print(f"by split: {corpus.claims['split'].value_counts().to_dict()}")
          print(f"reconciliation: {corpus.manifest['reconciliation']['n_dropped']} dropped")

          assert corpus.manifest["split_verification"] == "ok"
          assert len(corpus.manifest["entries"]) == len(corpus)

          # Every claim's bytes must match the SHA the manifest recorded —
          # this is what makes the "rebuildable from the recipe" claim in
          # docs/DATA_CARD.md checkable rather than asserted.
          for claim, entry in zip(
              corpus.iter_claims(),
              sorted(corpus.manifest["entries"], key=lambda e: e["claim_id"]),
              strict=False,
          ):
              pass
          by_id = {e["claim_id"]: e for e in corpus.manifest["entries"]}
          for claim in corpus.iter_claims():
              digest = hashlib.sha256(claim.read_image_bytes()).hexdigest()
              assert digest == by_id[claim.claim_id]["output_sha256"], claim.claim_id
          print("corpus integrity OK")
          PY
