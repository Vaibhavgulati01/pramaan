name: CI

on:
  push:
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests eval benchmarks scripts

      - name: Type check (mypy)
        run: mypy src

      - name: Unit tests
        run: pytest --cov=pramaan --cov-report=term-missing

      - name: CLI smoke
        run: |
          python -m pramaan.cli --help
          python -m pramaan.cli setup

  # `smoke`-tier end-to-end pipeline run. This step is a no-op that only
  # asserts the CLI degrades cleanly until Phase 6 lands `pramaan all
  # --scale smoke` for real — see docs/EVALUATION_PROTOCOL.md for the
  # three-tier discipline (smoke/dev/full) this budget is built around.
  # Target once landed: < 5 minutes.
  smoke-pipeline:
    runs-on: ubuntu-latest
    needs: lint-type-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: pramaan all --scale smoke
        run: python -m pramaan.cli all --scale smoke
