[project]
name = "pramaan"
version = "0.1.0"
description = "Risk-controlled selective adjudication of claim evidence — certified three-tier fraud decisions via Learn-then-Test."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = "==3.13.*"
authors = [{ name = "PRAMAAN contributors" }]

dependencies = [
    "numpy>=1.26,<2.2",
    "scipy>=1.11,<1.15",
    "pandas>=2.1,<2.3",
    "scikit-learn>=1.4,<1.6",
    "lightgbm>=4.3,<4.6",
    "faiss-cpu>=1.8,<1.10",
    "torch>=2.6,<2.9",
    "open-clip-torch>=2.24,<2.30",
    "ImageHash>=4.3,<4.4",
    "Pillow>=10.3,<11.1",
    "shap>=0.45,<0.47",
    "rapidfuzz>=3.6,<3.11",
    "indic-transliteration>=2.3,<2.5",
    "networkx>=3.2,<3.5",
    "pydantic>=2.6,<2.10",
    "hydra-core>=1.3,<1.4",
    "fastapi>=0.110,<0.116",
    "uvicorn[standard]>=0.29,<0.35",
    "python-multipart>=0.0.9,<0.1",
    "typer>=0.15,<0.17",
    "piexif>=1.1,<1.2",
    "PyYAML>=6.0,<6.1",
    "matplotlib>=3.8,<3.11",
    "Faker>=25,<38",
    "datasets>=3.0,<4.0",
    "huggingface_hub>=0.24,<0.28",
]

[project.optional-dependencies]
# C2PA provenance reading. Optional: on some platforms the native wheel is
# unavailable; P1 (src/pramaan/pillars/p1_provenance.py) degrades to a
# graceful UNKNOWN when this import fails — that is the common real-world
# case in India anyway (WhatsApp strips C2PA), not just a fallback hack.
provenance = ["c2pa-python>=0.6,<0.8", "cryptography>=42,<44"]
docs = ["mkdocs>=1.6,<1.7", "mkdocs-material>=9.5,<9.6"]
dev = [
    "pytest>=8.1,<8.4",
    "pytest-cov>=5.0,<5.1",
    "hypothesis>=6.100,<6.113",
    "ruff>=0.6,<0.8",
    "mypy>=1.10,<1.12",
    "types-PyYAML>=6.0,<6.1",
]

[project.scripts]
pramaan = "pramaan.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pramaan"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer/FastAPI's `= typer.Option(...)` / `= Depends(...)` default-argument
# pattern is idiomatic and required by both frameworks, not the mutable-
# default-argument bug B008 flags.
"src/pramaan/cli.py" = ["B008"]
"src/pramaan/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
